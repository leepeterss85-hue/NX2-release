name: Publish verified Eden NX2 pass120 without personal access token
on:
  push:
    branches: [main]
    paths:
      - "releases/publish-pass120.json"
permissions:
  contents: write
concurrency:
  group: nx2-pass120-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX2_CANDIDATE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-e4f4-8211-bc5a-1eec67327792/raw?se=2026-11-04T17%3A45%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=c57599eb-a54f-5748-854f-398a135777c1&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T05%3A33%3A14Z&ske=2026-11-05T05%3A33%3A14Z&sks=b&skv=2026-02-06&sig=brTEJOBzHVtLuaFCXAPqSoJNcMsvtAtLaHu7N6sdiBY%3D"
    steps:
      - name: Verify public release destination and fetch the exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "leepeterss85-hue/NX2-release"
          curl -fL --retry 3 --connect-timeout 20 --max-time 900 "$NX2_CANDIDATE_URL" -o candidate-artifact.zip
          echo "6b542dfc2fd81f713bba029f79025c7a5878e304fff1c1b56095172868997c4e  candidate-artifact.zip" | sha256sum -c -
          mkdir candidate
          unzip -qq candidate-artifact.zip -d candidate
      - name: Validate pinned Pass120 provenance, checksum, runtime and update channel
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          d=pathlib.Path('candidate')
          for name in ('eden-nx2-windows-x64.zip','eden-nx2-windows-x64.zip.sha256','nx2-candidate-manifest.json','RELEASE_NOTES.md'):
            if not (d/name).is_file(): raise RuntimeError('Missing '+name)
          manifest=json.loads((d/'nx2-candidate-manifest.json').read_text())
          assert manifest['version']=='pass120'
          assert manifest['public_release_repo']=='leepeterss85-hue/NX2-release'
          assert manifest['source_run_id']==41801710902
          assert manifest['source_commit']=='0c12be0e16fa91644f67d6bf88ba0493f44a0293'
          name='eden-nx2-windows-x64.zip'
          z=d/name
          with z.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          assert digest=='b17f72a274deed96ecb254dab5b7e9912110a89c8bb497e72a25e537f00b0002'
          assert digest==manifest['archive_sha256']
          assert (d/(name+'.sha256')).read_text().strip()==digest+' *'+name
          with zipfile.ZipFile(z) as a:
            if a.testzip(): raise RuntimeError('Corrupt Windows runtime ZIP')
            paths=a.namelist()
            if any(p.startswith('/') or '\\' in p or '..' in pathlib.PurePosixPath(p).parts for p in paths): raise RuntimeError('Unsafe ZIP paths')
            roots={p.split('/')[0] for p in paths if p}
            if len(roots)!=1: raise RuntimeError('Wrong ZIP root layout')
            root=next(iter(roots))+'/'
            for filename in ('eden.exe','nx2-apply-update.ps1','nx2-update-channel.json','READ_ME_FIRST.txt'):
              if root+filename not in paths: raise RuntimeError('Missing runtime '+filename)
            if any(p.startswith(root+'user/') for p in paths): raise RuntimeError('User folder included')
            ch=json.loads(a.read(root+'nx2-update-channel.json'))
            assert ch['github_repo']=='leepeterss85-hue/NX2-release'
          print('Verified exact tested source, update channel and both SHA-256 digests.')
          PY
      - name: Publish stable pass120 with this repository's built-in GITHUB_TOKEN
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view pass120 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::pass120 release already exists, no overwrite allowed"
            exit 1
          fi
          gh release create pass120 candidate/eden-nx2-windows-x64.zip candidate/eden-nx2-windows-x64.zip.sha256 --repo "$GITHUB_REPOSITORY" --title "Eden NX2 pass120" --notes-file candidate/RELEASE_NOTES.md --latest
      - name: Verify public latest API lists both updater assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          url='https://api.github.com/repos/leepeterss85-hue/NX2-release/releases/latest'
          for attempt in range(12):
            try:
              req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'NX2-pass120-check'})
              with urllib.request.urlopen(req,timeout=40) as response: release=json.load(response)
              names={a['name'] for a in release.get('assets',[]) if a.get('state')=='uploaded'}
              if release.get('tag_name')=='pass120' and not release.get('draft') and not release.get('prerelease') and {'eden-nx2-windows-x64.zip','eden-nx2-windows-x64.zip.sha256'}<=names:
                print('PASS: published pass120 discoverable via /releases/latest with both Windows assets')
                break
            except Exception as e: print('Retry latest endpoint:',str(e))
            time.sleep(5)
          else: raise RuntimeError('Pass120 publication succeeded but latest updater endpoint not yet confirmed')
          PY
