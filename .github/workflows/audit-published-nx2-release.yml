name: Audit published NX2 updater release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify public latest endpoint and release assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, re, stat, urllib.request, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'NX2-release-audit','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  return response.read()
          release = json.loads(get('https://api.github.com/repos/'+repo+'/releases/latest'))
          tag = release.get('tag_name','')
          if not re.fullmatch(r'pass[1-9][0-9]{0,5}',tag) or release.get('draft') or release.get('prerelease'):
              raise SystemExit('Latest release is not a stable passNNN tag')
          assets = {a['name']:a for a in release.get('assets',[])}
          name = 'eden-nx2-windows-x64.zip'
          for required in (name,name+'.sha256'):
              item=assets.get(required)
              if not item or item.get('state')!='uploaded' or item.get('size',0)<=0:
                  raise SystemExit('Missing release asset: '+required)
              url='https://github.com/'+repo+'/releases/download/'+tag+'/'+required
              if item.get('browser_download_url')!=url:
                  raise SystemExit('Unexpected release asset URL')
          checksum=get(assets[name+'.sha256']['browser_download_url']).decode('ascii').strip()
          digest=re.fullmatch(r'([a-fA-F0-9]{64})\s+\*?'+re.escape(name),checksum)
          if not digest: raise SystemExit('Invalid sidecar checksum')
          data=get(assets[name]['browser_download_url'])
          if hashlib.sha256(data).hexdigest()!=digest.group(1).lower():
              raise SystemExit('Checksum mismatch')
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              roots=set(); paths={}; size=0
              for entry in z.infolist():
                  p=entry.filename
                  if not p or p.startswith('/') or '\\' in p or ':' in p or any(s in ('','.','..') for s in p.rstrip('/').split('/')):
                      raise SystemExit('Unsafe ZIP path')
                  parts=p.rstrip('/').split('/')
                  if len(parts)<2 and not entry.is_dir(): raise SystemExit('Unexpected archive root')
                  roots.add(parts[0])
                  size+=entry.file_size
                  if size>8*1024**3 or ((entry.external_attr>>16)&0o170000)==stat.S_IFLNK:
                      raise SystemExit('Unsafe ZIP entry')
                  if not entry.is_dir():
                      key='/'.join(parts[1:])
                      if key in paths: raise SystemExit('Duplicate path')
                      paths[key]=entry
              if len(roots)!=1 or any(k=='user' or k.startswith('user/') for k in paths):
                  raise SystemExit('Bad ZIP root or bundled private saves')
              for required in ('eden.exe','nx2-apply-update.ps1','nx2-update-channel.json','READ_ME_FIRST.txt'):
                  if required not in paths: raise SystemExit('Missing '+required)
              if paths['eden.exe'].file_size < 1000000 or z.read(paths['eden.exe'])[:2]!=b'MZ':
                  raise SystemExit('Invalid Windows EXE')
              if json.loads(z.read(paths['nx2-update-channel.json'])).get('github_repo')!=repo:
                  raise SystemExit('Wrong update channel')
              if ('NX2 update version: '+tag) not in z.read(paths['READ_ME_FIRST.txt']).decode('utf-8-sig'):
                  raise SystemExit('Version marker mismatch')
          print('PASS: public latest feed, release assets, checksum and ZIP structure')
          print('NOT PROVEN: Windows execution, gameplay, update installation or rollback')
          PY
